retrofit = "3.0.0"
loggingInterceptor = "5.3.2"
kotlinx-serialization = "1.9.0"
kotlinx-serialization-converter = "1.0.0"
hilt = "2.57.2"
ksp = "2.2.21-2.0.4"
navigation-compose = "2.9.6"
